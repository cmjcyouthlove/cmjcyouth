];


    /* =========================================
       타이머 변수
       ========================================= */

    let timerInterval;
    let remainSeconds = 0;


    /* =========================================
       카테고리 설정
       ========================================= */

    document.querySelectorAll('.cat').forEach(b => {

        b.addEventListener('click', function() {

            document
                .querySelectorAll('.cat')
                .forEach(x => x.classList.remove('active'));

            this.classList.add('active');

            /*
             * 신앙 카테고리일 때만
             * 초신자 배려 옵션 표시
             */
            document.getElementById('f-opt').style.display =
                (this.dataset.cat === "faith")
                ? 'block'
                : 'none';

        });

    });


    /* =========================================
       타이머 시작
       ========================================= */

    function startTimer() {

        clearInterval(timerInterval);

        remainSeconds =
            Number(document.getElementById("timerMinute").value) * 60;

        updateTimer();

        timerInterval = setInterval(() => {

            remainSeconds--;

            updateTimer();

            if (remainSeconds <= 0) {

                clearInterval(timerInterval);

                alert("⏰ 시간이 종료되었습니다.");

            }

        }, 1000);

    }


    /* =========================================
       타이머 화면 업데이트
       ========================================= */

    function updateTimer() {

        const min =
            Math.floor(remainSeconds / 60);

        const sec =
            remainSeconds % 60;

        document.getElementById("timer").innerHTML =
            `${min}:${String(sec).padStart(2, "0")}`;

    }


    /* =========================================
       질문 뽑기
       ========================================= */

    function draw() {

        const cat =
            document.querySelector('.cat.active').dataset.cat;

        let pool = [];


        /* 전체보기 */
        if (cat === 'all') {

            pool = [
                ...ICE,
                ...LIFE,
                ...FAITH,
                ...SFC
            ];

        }


        /* 아이스브레이킹 */
        else if (cat === 'ice') {

            pool = [
                ...ICE
            ];

        }


        /* 삶 / 가치관 */
        else if (cat === 'life') {

            pool = [
                ...LIFE
            ];

        }


        /* 신앙 */
        else if (cat === 'faith') {

            pool = [
                ...FAITH
            ];

            /*
             * 깊은 질문 제외 체크가
             * 해제되어 있다면 DEEP도 포함
             */
            if (!document.getElementById('deep').checked) {

                pool = [
                    ...pool,
                    ...DEEP
                ];

            }

        }


        /* ⭐ SFC */
        else if (cat === 'sfc') {

            pool = [
                ...SFC
            ];

        }


        /* 기존 질문 삭제 */
        document.getElementById('q-box').innerHTML = "";


        /* =========================================
           타이머 로직
           ========================================= */

        const useTimer =
            document.getElementById("useTimer").checked;

        const keepTimer =
            document.getElementById("keepTimer").checked;


        if (useTimer) {

            /*
             * 타이머 유지가 체크되어 있고
             * 기존 타이머가 돌아가는 중이면
             * 타이머를 다시 시작하지 않음
             */
            if (remainSeconds === 0 || !keepTimer) {

                startTimer();

            }

        }

        else {

            clearInterval(timerInterval);

            document.getElementById("timer").innerHTML = "";

            remainSeconds = 0;

        }


        /* =========================================
           랜덤 질문 5개
           ========================================= */

        for (let i = 0; i < 5; i++) {

            if (pool.length === 0) break;

            const index =
                Math.floor(Math.random() * pool.length);

            const q =
                pool.splice(index, 1)[0];

            document.getElementById('q-box').innerHTML +=
                `<div class="card">${i + 1}. ${q}</div>`;

        }

    }


    /* =========================================
       질문 복사
       ========================================= */

    function copy() {

        const text =
            Array.from(
                document.querySelectorAll('.card')
            )
            .map(c => c.innerText)
            .join('\n');


        if (text) {

            navigator.clipboard
                .writeText(text)
                .then(() => alert("복사되었습니다!"));

        }

    }

</script>
