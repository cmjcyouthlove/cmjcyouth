    // 타이머 변수
    let timerInterval;
    let remainSeconds = 0;

    // 카테고리 설정
    document.querySelectorAll('.cat').forEach(b => {
        b.addEventListener('click', function() {
            document.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('f-opt').style.display = (this.dataset.cat === "faith") ? 'block' : 'none';
        });
    });

    // 타이머 함수들
    function startTimer() {
        clearInterval(timerInterval);
        remainSeconds = Number(document.getElementById("timerMinute").value) * 60;
        updateTimer();
        timerInterval = setInterval(() => {
            remainSeconds--;
            updateTimer();
            if (remainSeconds <= 0) {
                clearInterval(timerInterval);
                alert("⏰ 시간이 종료되었습니다.");
            }
        }, 1000);
    }

    function updateTimer() {
        const min = Math.floor(remainSeconds / 60);
        const sec = remainSeconds % 60;
        document.getElementById("timer").innerHTML = `${min}:${String(sec).padStart(2, "0")}`;
    }

    // 질문 뽑기
    function draw() {
        const cat = document.querySelector('.cat.active').dataset.cat;
        let pool = [];
        
        if (cat === 'all') {
            pool = [...ICE, ...LIFE, ...FAITH, ...SFC];
        }
        else if (cat === 'ice') {
            pool = [...ICE];
        }
        else if (cat === 'life') {
            pool = [...LIFE];
        }
        else if (cat === 'faith') {
            pool = [...FAITH];

            if (!document.getElementById('deep').checked) {
                pool = [...pool, ...DEEP];
            }
        }
        else if (cat === 'sfc') {
            pool = [...SFC];
        }
        
        document.getElementById('q-box').innerHTML = "";
        
        // 타이머 로직 적용
        const useTimer = document.getElementById("useTimer").checked;
        const keepTimer = document.getElementById("keepTimer").checked;
        
        if (useTimer) {
            if (remainSeconds === 0 || !keepTimer) {
                startTimer();
            }
        } else {
            clearInterval(timerInterval);
            document.getElementById("timer").innerHTML = "";
            remainSeconds = 0;
        }
        
        for(let i=0; i<5; i++) {
            if(pool.length === 0) break;
            let index = Math.floor(Math.random() * pool.length);
            let q = pool.splice(index, 1)[0];
            document.getElementById('q-box').innerHTML += `<div class="card">${i+1}. ${q}</div>`;
        }
    }

    function copy() {
        const text = Array.from(document.querySelectorAll('.card')).map(c => c.innerText).join('\n');
        if (text) {
            navigator.clipboard.writeText(text).then(() => alert("복사되었습니다!"));
        }
    }
